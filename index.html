<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>I love u Haya</title>

  <!-- iOS: nicer add-to-home-screen experience -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Peace Timer">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --pink1:#ffe3ee; --pink2:#ffc6dd; --pink3:#ff9cc2; --pink4:#ff6fa6; --rose:#ff3e8a;
      --text:#422536; --glass: rgba(255,255,255,.55);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-size:18px; /* avoids iOS zoom on inputs */
      color:var(--text);
      background:
        radial-gradient(1200px 1200px at 85% -10%, #ffd0e4 0%, transparent 60%),
        radial-gradient(900px 900px at -10% 90%, #ffd9ea 0%, transparent 60%),
        linear-gradient(145deg, var(--pink1), var(--pink2));
      display:grid; place-items:center;
      padding:24px 20px calc(24px + var(--safe-bottom));
      padding-top: calc(24px + var(--safe-top));
    }
    .card{
      width:min(720px, 96vw);
      backdrop-filter: blur(10px);
      background: linear-gradient(180deg, var(--glass), rgba(255,255,255,.78));
      border:1px solid rgba(255,255,255,.7);
      border-radius:28px;
      box-shadow: 0 20px 60px rgba(255, 111, 166, .25);
      padding:24px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    h1{margin:.2rem 0 .6rem; font-weight:700; font-size:clamp(1.3rem, 1.2rem + 1.3vw, 1.9rem); color:#5a2a3c;}
    .sub{opacity:.9; margin:0 0 1rem; font-size:1rem}
    .ribbon{
      position:absolute; inset:auto -20px -20px auto;
      transform:rotate(-12deg); font-weight:700; letter-spacing:.08em;
      font-size:.72rem; color:#fff;
      background: linear-gradient(90deg, var(--pink4), var(--rose));
      padding:6px 16px; border-radius:999px; opacity:.9;
    }
    .section{display:none}
    .section.active{display:block}

    /* Setup */
    .setup-grid{
      display:grid; gap:14px; justify-items:center; margin:10px 0 6px;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
    }
    .field{
      background:#fff; border:1px solid #ffd1e4; border-radius:16px; padding:10px 12px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.6);
      width:100%;
    }
    label{display:block; font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:#7a4156; margin-bottom:6px}
    input[type=number]{
      width:100%; border:0; outline:0; background:transparent; font-size:1.25rem; font-weight:700; text-align:center; color:#5a2a3c;
      appearance: textfield;
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }

    .btn-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px}
    button{
      border:0; border-radius:999px; padding:12px 18px; font-weight:700; cursor:pointer;
      box-shadow:0 10px 22px rgba(255, 111, 166, .25);
      transition:transform .07s ease, box-shadow .2s ease, opacity .2s ease;
      touch-action:manipulation;
    }
    button:active{transform:translateY(1px) scale(.99)}
    .primary{color:#fff; background:linear-gradient(90deg, var(--pink4), var(--rose));}
    .ghost{background:transparent; border:1px solid #ffc3dc; color:#7a4156;}
    .tiny{font-size:.85rem; opacity:.75; margin-top:10px}

    /* Timer */
    .timer{
      display:inline-grid; grid-auto-flow:column; gap:14px; align-items:end; margin:8px 0 14px;
    }
    .unit{display:grid; gap:6px; justify-items:center}
    .bubble{
      min-width:96px; padding:12px 16px; border-radius:18px;
      background:linear-gradient(180deg,#fff, #ffe6f1);
      border:1px solid #ffd1e4;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.6), 0 8px 20px rgba(255, 156, 194, .25);
      font-weight:700; font-size:clamp(1.6rem, 1.1rem + 2.2vw, 2.2rem); line-height:1.1;
      user-select:none;
    }
    .label{font-size:.8rem; text-transform:uppercase; letter-spacing:.12em; color:#7a4156;}
    .msg{
      margin:10px auto 12px;
      font-size:1.05rem; font-weight:600;
      background: linear-gradient(90deg, #c5356f, #ff4f9b);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }

    @media (max-width:430px){
      .bubble{min-width:78px}
      .ribbon{display:none}
      .setup-grid{grid-template-columns:1fr 1fr 1fr}
    }

    /* Big touch targets on iOS */
    .btn-row > button { min-width:120px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="ribbon">peace treaty 💞</span>
    <h1>Bas itne der naraz reh sakte ho aap 💗</h1>
    <p class="sub">Set the time, press start — then only pyaar. I love you.</p>

    <!-- Setup Section -->
    <section id="setup" class="section active" aria-labelledby="setupTitle">
      <h2 id="setupTitle" class="visually-hidden" style="position:absolute;left:-9999px">Setup</h2>
      <div class="setup-grid" role="group" aria-label="Timer duration">
        <div class="field">
          <label for="hours">Hours</label>
          <input id="hours" type="number" inputmode="numeric" min="0" max="23" value="2">
        </div>
        <div class="field">
          <label for="minutes">Minutes</label>
          <input id="minutes" type="number" inputmode="numeric" min="0" max="59" value="0">
        </div>
        <div class="field">
          <label for="seconds">Seconds</label>
          <input id="seconds" type="number" inputmode="numeric" min="0" max="59" value="0">
        </div>
      </div>
      <div class="btn-row">
        <button class="ghost" id="preset90">Preset 1h 30m</button>
        <button class="ghost" id="preset60">Preset 1h</button>
        <button class="ghost" id="preset30">Preset 30m</button>
      </div>
      <div class="btn-row">
        <button class="primary" id="startBtn">Start</button>
        <button class="ghost" id="resumeIfAny">Resume saved</button>
      </div>
      <div class="tiny">iloveuiloveui Making websites is my love language loveuiloveuiloveu</div>
    </section>

    <!-- Running Section -->
    <section id="running" class="section" aria-live="polite" aria-labelledby="runningTitle">
      <h2 id="runningTitle" class="visually-hidden" style="position:absolute;left:-9999px">Running</h2>

      <p class="msg" id="statusText">“Bas itne der…” clock is ticking ⏳</p>

      <div class="timer" role="timer">
        <div class="unit">
          <div class="bubble" id="H">00</div>
          <div class="label">hours</div>
        </div>
        <div class="unit">
          <div class="bubble" id="M">00</div>
          <div class="label">minutes</div>
        </div>
        <div class="unit">
          <div class="bubble" id="S">00</div>
          <div class="label">seconds</div>
        </div>
      </div>

      <div class="btn-row" id="lessenRow" aria-label="Lessen time">
        <button class="ghost" data-less="60000">-1 min</button>
        <button class="ghost" data-less="300000">-5 min</button>
        <button class="ghost" data-less="600000">-10 min</button>
        <button class="ghost" data-less="1800000">-30 min</button>
      </div>

      <div class="btn-row">
        <button class="primary" id="pauseBtn">Pause</button>
        <button class="ghost" id="editBtn">Change time</button>
        <button class="ghost" id="resetBtn">Clear</button>
      </div>

      <div class="tiny" id="endHint"></div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
