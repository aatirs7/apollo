<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pink Peace Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --pink1:#ffe3ee;
      --pink2:#ffc6dd;
      --pink3:#ff9cc2;
      --pink4:#ff6fa6;
      --rose:#ff3e8a;
      --text:#422536;
      --glass: rgba(255,255,255,.55);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Poppins", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1200px 1200px at 85% -10%, #ffd0e4 0%, transparent 60%),
        radial-gradient(900px 900px at -10% 90%, #ffd9ea 0%, transparent 60%),
        linear-gradient(145deg, var(--pink1), var(--pink2));
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      width:min(680px, 92vw);
      backdrop-filter: blur(10px);
      background: linear-gradient(180deg, var(--glass), rgba(255,255,255,.75));
      border:1px solid rgba(255,255,255,.7);
      border-radius:28px;
      box-shadow: 0 20px 60px rgba(255, 111, 166, .25);
      padding:28px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .ribbon{
      position:absolute;
      inset:auto -20px -20px auto;
      transform:rotate(-12deg);
      font-weight:700;
      letter-spacing:.08em;
      font-size:.72rem;
      color:#fff;
      background: linear-gradient(90deg, var(--pink4), var(--rose));
      padding:6px 16px;
      border-radius:999px;
      opacity:.9;
    }
    h1{
      margin:.2rem 0 .6rem;
      font-weight:700;
      font-size:clamp(1.4rem, 2.4vw + 1rem, 2rem);
      color:#5a2a3c;
    }
    .sub{
      margin:.2rem 0 1.2rem;
      font-size:clamp(.95rem, .4vw + .8rem, 1.05rem);
      opacity:.85;
    }
    .timer{
      display:inline-grid;
      grid-auto-flow:column;
      gap:14px;
      align-items:end;
      margin:10px 0 18px;
    }
    .unit{
      display:grid;
      gap:6px;
      justify-items:center;
    }
    .bubble{
      min-width:90px;
      padding:12px 16px;
      border-radius:18px;
      background:linear-gradient(180deg,#fff, #ffe6f1);
      border:1px solid #ffd1e4;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.6), 0 8px 20px rgba(255, 156, 194, .25);
      font-weight:700;
      font-size:clamp(1.6rem, 3.2vw + .6rem, 2.4rem);
      line-height:1.1;
    }
    .label{
      font-size:.8rem;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#7a4156;
      opacity:.9;
    }
    .msg{
      margin:14px auto 18px;
      font-size:clamp(1rem, .6vw + .9rem, 1.15rem);
      background: linear-gradient(90deg, #c5356f, #ff4f9b);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      font-weight:600;
    }
    .controls{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:6px;
    }
    button{
      border:0;
      border-radius:999px;
      padding:10px 16px;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(255, 111, 166, .25);
      transition:transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }
    button:active{ transform:translateY(1px) scale(.99) }
    .primary{
      color:#fff;
      background:linear-gradient(90deg, var(--pink4), var(--rose));
    }
    .ghost{
      background:transparent;
      border:1px solid #ffc3dc;
      color:#7a4156;
    }
    .heart{
      position:absolute;
      inset: -40px auto auto -40px;
      width:140px;height:140px;
      opacity:.18;
      filter: blur(1px);
      background:
        radial-gradient(circle at 30% 35%, var(--pink3) 0 42%, transparent 45%),
        radial-gradient(circle at 70% 35%, var(--pink3) 0 42%, transparent 45%),
        radial-gradient(60% 60% at 50% 70%, var(--pink3) 0 64%, transparent 66%);
      transform: rotate(-18deg);
    }
    .tiny{
      font-size:.8rem;
      opacity:.7;
      margin-top:8px;
    }
    @media (max-width:430px){
      .bubble{min-width:74px}
      .ribbon{display:none}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart" aria-hidden="true"></div>
    <span class="ribbon">peace treaty 💞</span>

    <h1>Bas itne der naraz reh sakte ho aap 💗</h1>
    <p class="sub">Two hours of cool-down, then only pyaar. I love you.</p>

    <div class="timer" role="timer" aria-live="polite">
      <div class="unit">
        <div class="bubble" id="hours">02</div>
        <div class="label">hours</div>
      </div>
      <div class="unit">
        <div class="bubble" id="minutes">00</div>
        <div class="label">minutes</div>
      </div>
      <div class="unit">
        <div class="bubble" id="seconds">00</div>
        <div class="label">seconds</div>
      </div>
    </div>

    <p id="status" class="msg">“Bas itne der…” clock is ticking ⏳</p>

    <div class="controls">
      <button class="primary" id="restartBtn">Restart 2h</button>
      <button class="ghost" id="pauseBtn">Pause</button>
    </div>

    <div class="tiny">Tip: leave the tab open—timer keeps going even if you refresh.</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
